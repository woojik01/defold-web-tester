services:
  defold-web-tester:
    build:
      context: .
      args:
        BOB_VERSION: "1.12.4"
    ports:
      - "3000:3000"
    environment:
      MAX_UPLOAD_MB: "100"
      MAX_UNCOMPRESSED_MB: "500"
      BUILD_TIMEOUT_MS: "300000"
      WORK_ROOT: "/tmp/defold-web-tester"
    volumes:
      - defold_jobs:/tmp/defold-web-tester
    restart: unless-stopped

volumes:
  defold_jobs:
