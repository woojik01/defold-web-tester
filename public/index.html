<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>Defold Preview</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark;background:#090b10;color:#f4f6fa}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#090b10}
    body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
    button,input{font:inherit}
    .app{width:min(980px,100%);margin:0 auto;padding:18px 14px 28px}
    header{padding:8px 4px 16px}
    h1{font-size:24px;margin:0 0 6px;letter-spacing:-.03em}
    .sub{margin:0;color:#9ca3af;font-size:14px}
    .upload{border:1px dashed #3b4352;border-radius:18px;background:#11151d;padding:18px;transition:.15s}
    .upload.drag{border-color:#7aa2ff;background:#151b27}
    .picker{display:block;cursor:pointer}
    .picker input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
    .pickbox{min-height:130px;display:grid;place-items:center;text-align:center;border-radius:13px;background:#0b0e14;padding:20px}
    .picktitle{font-weight:750;font-size:16px}
    .pickhint{color:#8f98a7;font-size:13px;margin-top:5px}
    .filename{margin-top:10px;color:#cbd5e1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .run{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px 16px;background:#5b7cff;color:#fff;font-weight:750;cursor:pointer;touch-action:manipulation}
    .run:disabled{opacity:.5;cursor:wait}
    .progress{margin-top:14px;color:#aeb7c5;font-size:13px;min-height:20px;white-space:pre-wrap}
    .preview{margin-top:16px;background:#050609;border:1px solid #272d38;border-radius:18px;overflow:hidden}
    .bar{display:flex;align-items:center;gap:8px;min-height:48px;padding:8px 10px;border-bottom:1px solid #272d38;background:#11151d}
    .bar strong{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
    .icon{width:40px;height:40px;border:0;border-radius:10px;background:#1b2230;color:#e7ebf2;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
    .stage{position:relative;width:100%;height:min(78vh,760px);min-height:360px;background:#000}
    iframe{display:block;width:100%;height:100%;border:0;background:#000}
    .empty{position:absolute;inset:0;display:grid;place-items:center;color:#70798a;text-align:center;padding:30px;pointer-events:none}
    .hidden{display:none!important}
    .error{color:#ff8e8e}
    .ok{color:#8be3ad}
    .details{margin-top:10px;color:#7f8998;font-size:12px;line-height:1.6}
    @media (max-width:600px){
      .app{padding:12px 10px 20px}
      header{padding:7px 3px 12px}
      h1{font-size:21px}
      .upload{padding:12px;border-radius:15px}
      .pickbox{min-height:112px}
      .stage{height:calc(100svh - 92px);min-height:300px}
      .preview{margin-left:-10px;margin-right:-10px;border-left:0;border-right:0;border-radius:0}
      .bar{padding-left:10px;padding-right:10px}
    }
    @media (orientation:landscape) and (max-height:600px){.stage{height:calc(100svh - 50px);min-height:250px}.bar{min-height:44px}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Defold Preview</h1>
    <p class="sub">Defold 프로젝트 ZIP을 올리면 자동으로 HTML5 빌드 후 바로 미리보기합니다.</p>
  </header>

  <section class="upload" id="uploadBox">
    <label class="picker" for="file">
      <input id="file" type="file" accept=".zip,application/zip">
      <div class="pickbox">
        <div>
          <div class="picktitle">ZIP 파일 선택</div>
          <div class="pickhint">휴대폰에서는 파일 앱에서 .zip을 선택하세요.</div>
          <div class="filename" id="filename">선택된 파일 없음</div>
        </div>
      </div>
    </label>
    <button class="run" id="run" disabled>미리보기 실행</button>
    <div class="progress" id="progress"></div>
    <div class="details" id="details"></div>
  </section>

  <section class="preview hidden" id="preview">
    <div class="bar">
      <strong id="title">Game Preview</strong>
      <button class="icon" id="reload" title="다시 실행" aria-label="다시 실행">↻</button>
      <button class="icon" id="fullscreen" title="전체 화면" aria-label="전체 화면">⛶</button>
    </div>
    <div class="stage" id="stage">
      <iframe id="game" title="Defold game preview" allow="autoplay; fullscreen; gamepad; pointer-lock" allowfullscreen></iframe>
      <div class="empty" id="empty">빌드된 Defold 게임이 여기에 표시됩니다.</div>
    </div>
  </section>
</div>

<script>
const fileInput=document.querySelector('#file');
const runButton=document.querySelector('#run');
const uploadBox=document.querySelector('#uploadBox');
const filename=document.querySelector('#filename');
const progress=document.querySelector('#progress');
const details=document.querySelector('#details');
const preview=document.querySelector('#preview');
const stage=document.querySelector('#stage');
const game=document.querySelector('#game');
const empty=document.querySelector('#empty');
const title=document.querySelector('#title');
const reload=document.querySelector('#reload');
const fullscreen=document.querySelector('#fullscreen');
let gameUrl='';

fileInput.addEventListener('change',()=>{
  const file=fileInput.files[0];
  filename.textContent=file?`${file.name} · ${formatSize(file.size)}`:'선택된 파일 없음';
  runButton.disabled=!file;
  progress.textContent='';
  details.textContent='';
});

for(const event of ['dragenter','dragover']) uploadBox.addEventListener(event,e=>{e.preventDefault();uploadBox.classList.add('drag')});
for(const event of ['dragleave','drop']) uploadBox.addEventListener(event,e=>{e.preventDefault();uploadBox.classList.remove('drag')});
uploadBox.addEventListener('drop',e=>{
  const file=[...e.dataTransfer.files].find(f=>f.name.toLowerCase().endsWith('.zip'));
  if(!file)return setProgress('ZIP 파일만 사용할 수 있습니다.',true);
  const dt=new DataTransfer();dt.items.add(file);fileInput.files=dt.files;fileInput.dispatchEvent(new Event('change'));
});

runButton.addEventListener('click',async()=>{
  const file=fileInput.files[0];
  if(!file)return;
  runButton.disabled=true;
  preview.classList.add('hidden');
  game.removeAttribute('src');
  details.textContent='';
  setProgress('1/3  ZIP 업로드 중...');
  const form=new FormData();form.append('project',file);
  try{
    setProgress('2/3  Defold 프로젝트 분석 및 HTML5 빌드 중...');
    const response=await fetch('/api/build',{method:'POST',body:form});
    const data=await response.json();
    if(!response.ok) throw new Error(data.error||'빌드에 실패했습니다.'+(data.output?'\n\n'+data.output:''));
    gameUrl=data.gameUrl;
    title.textContent=data.projectName||'Game Preview';
    details.textContent=`${data.projectName||'Unknown'} · Defold ${data.version||'Unknown'}`;
    setProgress('3/3  미리보기 실행 중...','ok');
    preview.classList.remove('hidden');
    empty.classList.remove('hidden');
    game.onload=()=>empty.classList.add('hidden');
    game.src=gameUrl;
    preview.scrollIntoView({behavior:'smooth',block:'start'});
  }catch(error){
    setProgress(error.message||'처리 중 오류가 발생했습니다.',true);
  }finally{runButton.disabled=false;}
});

reload.addEventListener('click',()=>{if(gameUrl){empty.classList.remove('hidden');game.src='';requestAnimationFrame(()=>game.src=gameUrl)}});
fullscreen.addEventListener('click',async()=>{
  try{if(document.fullscreenElement)await document.exitFullscreen();else await stage.requestFullscreen()}catch{}
});

function setProgress(text,error=false){progress.textContent=text;progress.className='progress '+(error?'error':'')}
function formatSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';return (bytes/1024/1024).toFixed(1)+' MB'}
</script>
</body>
</html>
