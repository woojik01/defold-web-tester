  <div class="status" id="status">
    대기 중
  </div>  <button id="runButton" disabled>
    테스트 실행
  </button>  <div class="log" id="log"></div>  <div class="preview">

"use strict";

/*
 * ============================================================
 * Defold Web Tester - Debug Version
 * ============================================================
 */

const fileInput = document.getElementById("fileInput");
const runButton = document.getElementById("runButton");
const statusElement = document.getElementById("status");
const logElement = document.getElementById("log");
const gameFrame = document.getElementById("gameFrame");

let selectedFile = null;


/* ------------------------------------------------------------
 * LOGGING
 * ------------------------------------------------------------ */

function log(message, data = null) {
  const time = new Date().toLocaleTimeString();

  let text = `[${time}] ${message}`;

  if (data !== null) {
    try {
      text += "\n" + JSON.stringify(data, null, 2);
    } catch {
      text += "\n" + String(data);
    }
  }

  console.log(text);

  const line = document.createElement("div");
  line.textContent = text;

  logElement.appendChild(line);
  logElement.scrollTop = logElement.scrollHeight;
}


function setStatus(message) {
  statusElement.textContent = message;
  log("STATUS: " + message);
}


/* ------------------------------------------------------------
 * INITIALIZATION
 * ------------------------------------------------------------ */

log("페이지 초기화");

log("현재 URL", location.href);

log("User Agent", navigator.userAgent);

log("브라우저 정보", {
  language: navigator.language,
  online: navigator.onLine,
  platform: navigator.platform
});

log("파일 선택 input 생성 완료");


/* ------------------------------------------------------------
 * FILE SELECTION
 * ------------------------------------------------------------ */

fileInput.addEventListener("change", function(event) {

  log("input change 이벤트 발생");

  const files = event.target.files;

  log("선택된 파일 개수: " + files.length);

  if (!files || files.length === 0) {

    log("파일이 선택되지 않았습니다.");

    selectedFile = null;
    runButton.disabled = true;

    setStatus("파일이 선택되지 않음");

    return;
  }

  const file = files[0];

  log("파일 객체 수신 성공");

  log("파일 정보", {
    name: file.name,
    size: file.size,
    type: file.type,
    lastModified: file.lastModified
  });


  /* ZIP 확장자 검사 */

  const lowerName = file.name.toLowerCase();

  if (!lowerName.endsWith(".zip")) {

    log("ERROR: ZIP 확장자가 아닙니다.");

    setStatus("ZIP 파일만 선택할 수 있습니다.");

    selectedFile = null;
    runButton.disabled = true;

    return;
  }


  /* 파일 크기 검사 */

  if (file.size === 0) {

    log("ERROR: 파일 크기가 0 byte입니다.");

    setStatus("빈 ZIP 파일입니다.");

    selectedFile = null;
    runButton.disabled = true;

    return;
  }


  selectedFile = file;

  runButton.disabled = false;

  setStatus("ZIP 선택 완료");

  log("ZIP 파일 선택 성공");
  log("서버 업로드 준비 완료");

});


/* ------------------------------------------------------------
 * RUN
 * ------------------------------------------------------------ */

runButton.addEventListener("click", async function() {

  log("테스트 실행 버튼 클릭");

  if (!selectedFile) {

    log("ERROR: selectedFile이 없습니다.");

    setStatus("ZIP 파일을 먼저 선택하세요.");

    return;
  }

  runButton.disabled = true;

  setStatus("서버에 ZIP 업로드 중...");


  /* ----------------------------------------------------------
   * FormData
   * ---------------------------------------------------------- */

  const formData = new FormData();

  log("FormData 생성");

  /*
   * 중요:
   *
   * 서버의 multer 설정이
   *
   * upload.single("project")
   *
   * 라면 반드시 "project"라는 이름을 사용해야 한다.
   */

  formData.append("project", selectedFile, selectedFile.name);

  log("FormData에 파일 추가", {
    fieldName: "project",
    fileName: selectedFile.name,
    size: selectedFile.size,
    type: selectedFile.type
  });


  /* ----------------------------------------------------------
   * REQUEST
   * ---------------------------------------------------------- */

  const uploadUrl = "/api/build";

  log("POST 요청 시작");
  log("요청 URL: " + uploadUrl);


  try {

    const response = await fetch(uploadUrl, {
      method: "POST",
      body: formData
    });


    log("서버 응답 수신");

    log("HTTP 응답 정보", {
      status: response.status,
      statusText: response.statusText,
      ok: response.ok,
      contentType: response.headers.get("content-type")
    });


    /* --------------------------------------------------------
     * RESPONSE BODY
     * -------------------------------------------------------- */

    const responseText = await response.text();

    log("서버 응답 원문", responseText);


    let result = null;

    try {

      result = JSON.parse(responseText);

      log("JSON 파싱 성공", result);

    } catch (error) {

      log("JSON 파싱 실패");

      log("서버가 JSON이 아닌 응답을 반환했습니다.");

    }


    /* --------------------------------------------------------
     * ERROR
     * -------------------------------------------------------- */

    if (!response.ok) {

      log("BUILD ERROR");

      if (result && result.error) {

        log("서버 오류 메시지: " + result.error);

      } else {

        log("서버 오류 응답을 확인하세요.");

      }

      setStatus("빌드 실패");

      runButton.disabled = false;

      return;
    }


    /* --------------------------------------------------------
     * SUCCESS
     * -------------------------------------------------------- */

    log("서버 빌드 성공");

    if (!result) {

      log("ERROR: 성공 응답인데 JSON 결과가 없습니다.");

      setStatus("잘못된 서버 응답");

      runButton.disabled = false;

      return;
    }


    log("빌드 결과", result);


    /* --------------------------------------------------------
     * GAME URL
     * -------------------------------------------------------- */

    let gameUrl = null;

    if (result.url) {
      gameUrl = result.url;
    }

    if (result.previewUrl) {
      gameUrl = result.previewUrl;
    }

    if (result.gameUrl) {
      gameUrl = result.gameUrl;
    }


    if (!gameUrl) {

      log("ERROR: 서버 응답에서 게임 URL을 찾을 수 없습니다.");

      log("서버 응답 구조를 확인하세요.", result);

      setStatus("빌드는 성공했지만 게임 URL이 없습니다.");

      runButton.disabled = false;

      return;
    }


    log("게임 URL 발견: " + gameUrl);

    setStatus("게임 실행 중...");


    /* --------------------------------------------------------
     * IFRAME
     * -------------------------------------------------------- */

    gameFrame.src = gameUrl;

    log("iframe src 설정 완료");

    log("게임 미리보기 로딩 시작");


    gameFrame.onload = function() {

      log("게임 iframe load 이벤트 발생");

      setStatus("게임 로드 완료");

    };


    gameFrame.onerror = function(error) {

      log("iframe ERROR", error);

      setStatus("게임 iframe 로드 실패");

    };


  } catch (error) {

    log("FETCH ERROR");

    log("오류 이름: " + error.name);

    log("오류 메시지: " + error.message);

    log("오류 객체", error);

    setStatus("서버 요청 실패");

  } finally {

    runButton.disabled = false;

  }

});


/* ------------------------------------------------------------
 * GLOBAL ERRORS
 * ------------------------------------------------------------ */

window.addEventListener("error", function(event) {

  log("GLOBAL JAVASCRIPT ERROR", {
    message: event.message,
    filename: event.filename,
    line: event.lineno,
    column: event.colno
  });

});


window.addEventListener("unhandledrejection", function(event) {

  log("UNHANDLED PROMISE REJECTION", {
    reason: String(event.reason)
  });

});


/* ------------------------------------------------------------
 * NETWORK STATUS
 * ------------------------------------------------------------ */

window.addEventListener("online", function() {

  log("네트워크 연결됨");

});


window.addEventListener("offline", function() {

  log("네트워크 연결 끊김");

});


log("초기화 완료");
log("ZIP 파일을 선택하세요.");

</script></body>
  </html>
